name: Validate wardrobe placeholders

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Compile Firestore rules
        run: firebase emulators:exec --only firestore --project demo-gta-wardrobe "node --check app.js"
