name: Convert catalog wrappers to real images

on:
  push:
    branches:
      - optimize/catalog-real-images-20260925

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conversion branch
        uses: actions/checkout@v4
        with:
          ref: optimize/catalog-real-images-20260925
          fetch-depth: 0

      - name: Convert embedded catalog images
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          pattern = re.compile(r'href="data:image/(jpeg|jpg|png|webp);base64,([^"]+)"')
          mapping = {}
          type_counts = {}

          svg_files = sorted(Path("assets/catalog").rglob("*.svg"))
          if len(svg_files) != 284:
              raise SystemExit(f"Expected 284 catalog SVG wrappers, found {len(svg_files)}")

          for path in svg_files:
              text = path.read_text(encoding="utf-8")
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"No supported embedded raster image in {path}")

              image_type = match.group(1).lower()
              ext = "jpg" if image_type in {"jpeg", "jpg"} else image_type
              raw = base64.b64decode(match.group(2), validate=True)

              if ext == "jpg" and not raw.startswith(b"\xff\xd8\xff"):
                  raise SystemExit(f"Invalid JPEG payload in {path}")
              if ext == "png" and not raw.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"Invalid PNG payload in {path}")
              if ext == "webp" and not (raw.startswith(b"RIFF") and raw[8:12] == b"WEBP"):
                  raise SystemExit(f"Invalid WEBP payload in {path}")

              new_path = path.with_suffix("." + ext)
              new_path.write_bytes(raw)
              mapping[path.as_posix()] = new_path.as_posix()
              type_counts[ext] = type_counts.get(ext, 0) + 1
              path.unlink()

          changed_json = 0
          for json_path in sorted(Path("catalog").rglob("*.json")):
              old_text = json_path.read_text(encoding="utf-8")
              new_text = old_text
              for old_path, new_path in mapping.items():
                  new_text = new_text.replace(old_path, new_path)
              if new_text != old_text:
                  json_path.write_text(new_text, encoding="utf-8")
                  changed_json += 1

          remaining_svg_files = list(Path("assets/catalog").rglob("*.svg"))
          if remaining_svg_files:
              raise SystemExit(f"SVG wrappers remain: {len(remaining_svg_files)}")

          remaining_svg_refs = []
          for json_path in sorted(Path("catalog").rglob("*.json")):
              text = json_path.read_text(encoding="utf-8")
              if ".svg" in text:
                  remaining_svg_refs.append(str(json_path))
          if remaining_svg_refs:
              raise SystemExit("SVG references remain in: " + ", ".join(remaining_svg_refs))

          missing = [new for new in mapping.values() if not Path(new).is_file()]
          if missing:
              raise SystemExit(f"Missing converted images: {len(missing)}")

          print(f"Converted {len(mapping)} catalog images: {type_counts}")
          print(f"Updated {changed_json} catalog JSON files")
          PY

      - name: Commit converted images
        shell: bash
        run: |
          rm -f .github/workflows/convert-catalog-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Convert catalog wrappers to real images"
          git push origin HEAD:optimize/catalog-real-images-20260925
